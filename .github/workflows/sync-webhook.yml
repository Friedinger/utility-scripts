name: Sync webhook

on:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [main]
    paths: [.github/workflows/sync-webhook.yml]
  workflow_dispatch:

# The webhook action authenticates with WEBHOOK_TOKEN, not the workflow token.
permissions: {}

jobs:
  run:
    uses: Friedinger/configs/.github/workflows/action-sync-webhook.yml@bebbf14f4d4cc08abfc751b1c44378ab0da613aa # v1.5.1
    secrets:
      WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
